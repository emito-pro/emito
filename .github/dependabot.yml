version: 2

updates:
  # The pnpm workspace (root manifest + every package/app inside it).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # One PR per class of update keeps the review queue readable.
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      production-minor-patch:
        dependency-type: production
        update-types: [minor, patch]
    commit-message:
      prefix: chore
      include: scope

  # `apps/docs` sits outside the workspace with its own lockfile.
  - package-ecosystem: npm
    directory: /apps/docs
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      docs-dependencies:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: chore(docs)

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
